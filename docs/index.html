<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaturbate Recorder</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8eb;
    --muted: #9aa3b2;
    --accent: #dc2828;
    --accent-dark: #a91f1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    position: relative;
    padding: 72px 24px 56px;
    text-align: center;
    background: radial-gradient(ellipse at top, rgba(220,40,40,0.14), transparent 60%);
    border-bottom: 1px solid var(--border);
  }
  /* 108.0 — vrai logo. Jusqu'ici la page dessinait un cercle gris avec un
     point rouge EN CSS, faute d'image : un dépannage qui a tenu cinq mois et
     que personne ne reconnaissait comme le logo du projet. */
  .logo {
    display: block;
    width: 88px; height: 88px;
    margin: 0 auto 20px;
  }
  h1 { font-size: 2.1rem; margin: 0 0 8px; }
  header p.tagline { color: var(--muted); font-size: 1.1rem; margin: 0 0 28px; }

  .lang-toggle {
    position: absolute;
    top: 20px;
    right: 24px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-toggle:hover { border-color: var(--muted); color: var(--text); }

  .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); text-decoration: none; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { border-color: var(--muted); text-decoration: none; }

  .sub-links { margin-top: 18px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .sub-links a { color: var(--muted); font-size: 0.9rem; }
  .sub-links a:hover { color: var(--text); }

  main { max-width: 880px; margin: 0 auto; padding: 56px 24px; }

  section { margin-bottom: 56px; }
  h2 { font-size: 1.4rem; margin-bottom: 18px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .card h3 { margin: 0 0 8px; font-size: 1rem; }
  .card p { margin: 0; color: var(--muted); font-size: 0.9rem; }

  .note {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 16px 20px;
    color: var(--muted);
    font-size: 0.92rem;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 32px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--text); }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #e3e5e8;
      --text: #1b1e24;
      --muted: #5c6370;
    }
  }
</style>
</head>
<body>

<header>
  <button class="lang-toggle" id="langToggle" type="button"></button>
  <img class="logo" src="assets/logo.png" alt="Chaturbate Recorder" width="88" height="88">
  <h1>Chaturbate Recorder</h1>
  <p class="tagline" id="tagline"></p>
  <div class="cta-row">
    <a class="btn btn-primary" id="ctaDownload" href="https://github.com/Tomoushie/ChaturbateRecorder/releases/latest"></a>
    <a class="btn btn-secondary" id="ctaSource" href="https://github.com/Tomoushie/ChaturbateRecorder"></a>
  </div>
  <div class="sub-links">
    <!-- 105.0 — en tête des liens : c'est la page qui répond aux questions
         que se pose quelqu'un après avoir installé, et le premier réflexe
         d'un développeur qui évalue un projet. -->
    <a id="navDocs" href="documentation.html"></a>
    <a id="navFeatures" href="features.html"></a>
    <a id="navScreenshots" href="screenshots.html"></a>
    <a id="navSentinelGuard" href="sentinelguard.html"></a>
    <a id="navRoadmap" href="roadmap.html"></a>
    <a id="navThanks" href="remerciements.html"></a>
    <a id="navLegal" href="legalite.html"></a>
  </div>
</header>

<main>
  <!--
    106.0 — Démarrage rapide, placé AVANT les fonctionnalités : quelqu'un qui
    arrive ici veut d'abord savoir s'il peut essayer, pas lire une liste de
    caractéristiques. Trois étapes, aucune décision à prendre.
  -->
  <section>
    <h2 id="quickTitle"></h2>
    <p id="quickIntro"></p>
    <div class="grid">
      <div class="card">
        <h3 id="step1Title"></h3>
        <p id="step1Desc"></p>
      </div>
      <div class="card">
        <h3 id="step2Title"></h3>
        <p id="step2Desc"></p>
      </div>
      <div class="card">
        <h3 id="step3Title"></h3>
        <p id="step3Desc"></p>
      </div>
    </div>
    <div class="note" id="quickNote"></div>
  </section>

  <section>
    <h2 id="featuresTitle"></h2>
    <div class="grid">
      <div class="card">
        <h3 id="feat1Title"></h3>
        <p id="feat1Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat2Title"></h3>
        <p id="feat2Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat3Title"></h3>
        <p id="feat3Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat4Title"></h3>
        <p id="feat4Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat5Title"></h3>
        <p id="feat5Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat6Title"></h3>
        <p id="feat6Desc"></p>
      </div>
    </div>
  </section>

  <section>
    <h2 id="installTitle"></h2>
    <p id="installText"></p>
    <div class="note" id="installNote"></div>
  </section>

  <section>
    <h2 id="sourceTitle"></h2>
    <p id="sourceText"></p>
  </section>
</main>

<footer>
  <p>
    <a href="https://github.com/Tomoushie/ChaturbateRecorder">GitHub</a>
    ·
    <a href="https://github.com/sponsors/Tomoushie" id="footerSponsor"></a>
    ·
    <a href="https://paypal.me/tomoushie" id="footerDonate"></a>
  </p>
</footer>

  function setLanguage(lang) {
    var s = STRINGS[lang];
    document.documentElement.lang = lang;
    document.getElementById("langToggle").textContent = s.langToggle;
    document.getElementById("tagline").textContent = s.tagline;
    document.getElementById("ctaDownload").textContent = s.ctaDownload;
    document.getElementById("ctaSource").textContent = s.ctaSource;
    document.getElementById("navDocs").textContent = s.navDocs;
    document.getElementById("navFeatures").textContent = s.navFeatures;
    document.getElementById("navScreenshots").textContent = s.navScreenshots;
    document.getElementById("navSentinelGuard").textContent = s.navSentinelGuard;
    document.getElementById("navRoadmap").textContent = s.navRoadmap;
    document.getElementById("navThanks").textContent = s.navThanks;
    document.getElementById("navLegal").textContent = s.navLegal;
    document.getElementById("quickTitle").textContent = s.quickTitle;
    document.getElementById("quickIntro").textContent = s.quickIntro;
    for (var k = 1; k <= 3; k++) {
      document.getElementById("step" + k + "Title").textContent = s["step" + k + "Title"];
      document.getElementById("step" + k + "Desc").textContent = s["step" + k + "Desc"];
    }
    document.getElementById("quickNote").innerHTML = s.quickNote;
    document.getElementById("featuresTitle").textContent = s.featuresTitle;
    for (var i = 1; i <= 6; i++) {
      document.getElementById("feat" + i + "Title").textContent = s["feat" + i + "Title"];
      document.getElementById("feat" + i + "Desc").textContent = s["feat" + i + "Desc"];
    }
    document.getElementById("installTitle").textContent = s.installTitle;
    document.getElementById("installText").innerHTML = s.installText;
    document.getElementById("installNote").innerHTML = s.installNote;
    document.getElementById("sourceTitle").textContent = s.sourceTitle;
    document.getElementById("sourceText").innerHTML = s.sourceText;
    document.getElementById("footerSponsor").textContent = s.footerSponsor;
    document.getElementById("footerDonate").textContent = s.footerDonate;
    localStorage.setItem("lang", lang);
  }

  var saved = localStorage.getItem("lang");
  var initial = saved || (navigator.language && navigator.language.toLowerCase().indexOf("fr") === 0 ? "fr" : "en");
  setLanguage(initial);

  document.getElementById("langToggle").addEventListener("click", function () {
    setLanguage(document.documentElement.lang === "fr" ? "en" : "fr");
  });
</script>

</body>
</html>
