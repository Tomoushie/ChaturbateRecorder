<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaturbate Recorder</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8eb;
    --muted: #9aa3b2;
    --accent: #dc2828;
    --accent-dark: #a91f1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    position: relative;
    padding: 72px 24px 56px;
    text-align: center;
    background: radial-gradient(ellipse at top, rgba(220,40,40,0.14), transparent 60%);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #2d2d30;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .logo::after {
    content: "";
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent);
  }
  h1 { font-size: 2.1rem; margin: 0 0 8px; }
  header p.tagline { color: var(--muted); font-size: 1.1rem; margin: 0 0 28px; }

  .lang-toggle {
    position: absolute;
    top: 20px;
    right: 24px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-toggle:hover { border-color: var(--muted); color: var(--text); }

  .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); text-decoration: none; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { border-color: var(--muted); text-decoration: none; }

  .sub-links { margin-top: 18px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .sub-links a { color: var(--muted); font-size: 0.9rem; }
  .sub-links a:hover { color: var(--text); }

  main { max-width: 880px; margin: 0 auto; padding: 56px 24px; }

  section { margin-bottom: 56px; }
  h2 { font-size: 1.4rem; margin-bottom: 18px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .card h3 { margin: 0 0 8px; font-size: 1rem; }
  .card p { margin: 0; color: var(--muted); font-size: 0.9rem; }

  .note {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 16px 20px;
    color: var(--muted);
    font-size: 0.92rem;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 32px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--text); }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #e3e5e8;
      --text: #1b1e24;
      --muted: #5c6370;
    }
  }
</style>
</head>
<body>

<header>
  <button class="lang-toggle" id="langToggle" type="button"></button>
  <div class="logo"></div>
  <h1>Chaturbate Recorder</h1>
  <p class="tagline" id="tagline"></p>
  <div class="cta-row">
    <a class="btn btn-primary" id="ctaDownload" href="https://github.com/Tomoushie/ChaturbateRecorder/releases/latest"></a>
    <a class="btn btn-secondary" id="ctaSource" href="https://github.com/Tomoushie/ChaturbateRecorder"></a>
  </div>
  <div class="sub-links">
    <a id="navFeatures" href="features.html"></a>
    <a id="navScreenshots" href="screenshots.html"></a>
    <a id="navSentinelGuard" href="sentinelguard.html"></a>
    <a id="navRoadmap" href="roadmap.html"></a>
    <a id="navLegal" href="legalite.html"></a>
  </div>
</header>

<main>
  <section>
    <h2 id="featuresTitle"></h2>
    <div class="grid">
      <div class="card">
        <h3 id="feat1Title"></h3>
        <p id="feat1Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat2Title"></h3>
        <p id="feat2Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat3Title"></h3>
        <p id="feat3Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat4Title"></h3>
        <p id="feat4Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat5Title"></h3>
        <p id="feat5Desc"></p>
      </div>
      <div class="card">
        <h3 id="feat6Title"></h3>
        <p id="feat6Desc"></p>
      </div>
    </div>
  </section>

  <section>
    <h2 id="installTitle"></h2>
    <p id="installText"></p>
    <div class="note" id="installNote"></div>
  </section>

  <section>
    <h2 id="sourceTitle"></h2>
    <p id="sourceText"></p>
  </section>
</main>

<footer>
  <p>
    <a href="https://github.com/Tomoushie/ChaturbateRecorder">GitHub</a>
    ·
    <a href="https://github.com/sponsors/Tomoushie" id="footerSponsor"></a>
    ·
    <a href="https://paypal.me/tomoushie" id="footerDonate"></a>
  </p>
</footer>

<script>
  // Bascule FR/EN (25.0) : même esprit que le sélecteur de langue de
  // l'application (mémorisé, bascule sans rechargement), en plus simple
  // puisque cette page est un simple fichier statique sans build.
  var STRINGS = {
    fr: {
      langToggle: "English",
      tagline: "Enregistreur de lives multi-stream pour Windows — sécurité, qualité et confidentialité configurables.",
      ctaDownload: "Télécharger la dernière version",
      ctaSource: "Code source (GitHub)",
      navFeatures: "Fonctionnalités détaillées",
      navScreenshots: "Captures d'écran",
      navSentinelGuard: "SentinelGuard (NuGet)",
      navRoadmap: "Roadmap",
      navLegal: "Legality",
      navLegal: "Légalité",
      featuresTitle: "Fonctionnalités",
      feat1Title: "Multi-stream",
      feat1Desc: "Enregistre plusieurs lives en parallèle sans ouvrir plusieurs instances de l'application.",
      feat2Title: "Qualité & codec au choix",
      feat2Desc: "Meilleure qualité, moyenne ou minimale ; réencodage optionnel en H.264/H.265 sans jamais toucher au fichier original.",
      feat3Title: "Format de sortie",
      feat3Desc: "MP4, MKV (plus robuste face à un arrêt brutal) ou MOV.",
      feat4Title: "Sécurité intégrée",
      feat4Desc: "Vérification du hash et de la signature de yt-dlp/ffmpeg, sandbox de chemins, détection d'ACL permissives, blocage des emplacements d'exécution suspects.",
      feat5Title: "Confidentialité",
      feat5Desc: "Support d'un proxy SOCKS5/HTTP et import de cookies navigateur pour le contenu réservé aux comptes connectés.",
      feat6Title: "Mises à jour intégrées",
      feat6Desc: "Bouton \"Rechercher une mise à jour\" qui vérifie les releases GitHub et installe la nouvelle version automatiquement.",
      installTitle: "Installation",
      installText: "Télécharge le ZIP de la <a href=\"https://github.com/Tomoushie/ChaturbateRecorder/releases/latest\">dernière release</a>, extrais-le où tu veux, et lance <code>ChaturbateRecorder.exe</code>.",
      installNote: "Nécessite le <a href=\"https://dotnet.microsoft.com/download/dotnet/10.0\">.NET 10 Desktop Runtime</a>. yt-dlp.exe et ffmpeg.exe ne sont pas inclus (voir le README du dépôt) pour rester neutre vis-à-vis de leurs licences respectives — place tes propres binaires dans un dossier <code>Tools\\</code> à côté de l'exécutable.",
      sourceTitle: "Code source",
      sourceText: "Le projet est open source sur <a href=\"https://github.com/Tomoushie/ChaturbateRecorder\">GitHub</a>. Contributions, retours et rapports de bugs sont les bienvenus via les issues du dépôt.",
      footerSponsor: "❤ Sponsoriser",
      footerDonate: "Soutenir le projet",
    },
    en: {
      langToggle: "Français",
      tagline: "Multi-stream live recorder for Windows — configurable security, quality, and privacy.",
      ctaDownload: "Download the latest version",
      ctaSource: "Source code (GitHub)",
      navFeatures: "Detailed features",
      navScreenshots: "Screenshots",
      navSentinelGuard: "SentinelGuard (NuGet)",
      navRoadmap: "Roadmap",
      featuresTitle: "Features",
      feat1Title: "Multi-stream",
      feat1Desc: "Records multiple lives in parallel without opening multiple instances of the app.",
      feat2Title: "Choice of quality & codec",
      feat2Desc: "Best, medium, or minimum quality; optional H.264/H.265 re-encoding that never touches the original file.",
      feat3Title: "Output format",
      feat3Desc: "MP4, MKV (more resilient to an abrupt stop), or MOV.",
      feat4Title: "Built-in security",
      feat4Desc: "Hash and signature verification for yt-dlp/ffmpeg, path sandboxing, permissive-ACL detection, blocking of suspicious execution locations.",
      feat5Title: "Privacy",
      feat5Desc: "SOCKS5/HTTP proxy support and browser cookie import for content restricted to logged-in accounts.",
      feat6Title: "Built-in updates",
      feat6Desc: "\"Check for updates\" button that checks GitHub releases and installs the new version automatically.",
      installTitle: "Installation",
      installText: "Download the ZIP of the <a href=\"https://github.com/Tomoushie/ChaturbateRecorder/releases/latest\">latest release</a>, extract it wherever you like, and launch <code>ChaturbateRecorder.exe</code>.",
      installNote: "Requires the <a href=\"https://dotnet.microsoft.com/download/dotnet/10.0\">.NET 10 Desktop Runtime</a>. yt-dlp.exe and ffmpeg.exe are not included (see the repo's README) to stay neutral regarding their respective licenses — place your own binaries in a <code>Tools\\</code> folder next to the executable.",
      sourceTitle: "Source code",
      sourceText: "The project is open source on <a href=\"https://github.com/Tomoushie/ChaturbateRecorder\">GitHub</a>. Contributions, feedback, and bug reports are welcome via the repo's issues.",
      footerSponsor: "❤ Sponsor",
      footerDonate: "Support the project",
    },
  };

  function setLanguage(lang) {
    var s = STRINGS[lang];
    document.documentElement.lang = lang;
    document.getElementById("langToggle").textContent = s.langToggle;
    document.getElementById("tagline").textContent = s.tagline;
    document.getElementById("ctaDownload").textContent = s.ctaDownload;
    document.getElementById("ctaSource").textContent = s.ctaSource;
    document.getElementById("navFeatures").textContent = s.navFeatures;
    document.getElementById("navScreenshots").textContent = s.navScreenshots;
    document.getElementById("navSentinelGuard").textContent = s.navSentinelGuard;
    document.getElementById("navRoadmap").textContent = s.navRoadmap;
    document.getElementById("navLegal").textContent = s.navLegal;
    document.getElementById("featuresTitle").textContent = s.featuresTitle;
    for (var i = 1; i <= 6; i++) {
      document.getElementById("feat" + i + "Title").textContent = s["feat" + i + "Title"];
      document.getElementById("feat" + i + "Desc").textContent = s["feat" + i + "Desc"];
    }
    document.getElementById("installTitle").textContent = s.installTitle;
    document.getElementById("installText").innerHTML = s.installText;
    document.getElementById("installNote").innerHTML = s.installNote;
    document.getElementById("sourceTitle").textContent = s.sourceTitle;
    document.getElementById("sourceText").innerHTML = s.sourceText;
    document.getElementById("footerSponsor").textContent = s.footerSponsor;
    document.getElementById("footerDonate").textContent = s.footerDonate;
    localStorage.setItem("lang", lang);
  }

  var saved = localStorage.getItem("lang");
  var initial = saved || (navigator.language && navigator.language.toLowerCase().indexOf("fr") === 0 ? "fr" : "en");
  setLanguage(initial);

  document.getElementById("langToggle").addEventListener("click", function () {
    setLanguage(document.documentElement.lang === "fr" ? "en" : "fr");
  });
</script>

</body>
</html>
