  :root {

    color: var(--text);

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {

    padding: 1px 5px;
    font-size: 0.88em;

  header {
    position: relative;
    padding: 56px 24px 40px;
    text-align: center;
    background: radial-gradient(ellipse at top, rgba(220,40,40,0.14), transparent 60%);
    border-bottom: 1px solid var(--border);

  .logo { display: block; width: 72px; height: 72px; margin: 0 auto 16px; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  header p.tagline { color: var(--muted); font-size: 1.05rem; margin: 0 0 24px; }

  .lang-toggle {
    position: absolute;
    top: 20px;
    right: 24px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-toggle:hover { border-color: var(--muted); color: var(--text); }

  .sub-links { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .sub-links a { color: var(--muted); font-size: 0.9rem; }
  .sub-links a:hover { color: var(--text); }

  main { max-width: 880px; margin: 0 auto; padding: 48px 24px; }
  section { margin-bottom: 56px; scroll-margin-top: 24px; }
  h2 { font-size: 1.35rem; margin: 0 0 8px; }
  h3 { font-size: 1rem; margin: 28px 0 8px; }
  section > p { color: var(--muted); }

  .toc {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 48px;
  }
  .toc ol { margin: 0; padding-left: 22px; columns: 2; column-gap: 32px; }
  .toc li { margin-bottom: 4px; }
  @media (max-width: 560px) { .toc ol { columns: 1; } }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .card h3 { margin: 0 0 8px; font-size: 1rem; }
  .card p { margin: 0; color: var(--muted); font-size: 0.9rem; }

  .note {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 16px 20px;
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 20px;
  }

  /* Le conteneur défile, jamais la page : un tableau large ne doit pas
     imposer un défilement horizontal à tout le document sur mobile. */
  .table-wrap { overflow-x: auto; margin-top: 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; min-width: 520px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text); font-weight: 600; white-space: nowrap; }
  td { color: var(--muted); }
  tbody tr:last-child td { border-bottom: none; }

  footer {
    border-top: 1px solid var(--border);
    padding: 32px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--text); }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #e3e5e8;
      --text: #1b1e24;
      --muted: #5c6370;
    }

  function fillTable(id, lang) {
    var rows = TABLES[id][lang];
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      html += "<tr>";
      for (var c = 0; c < rows[i].length; c++) {
        html += (c === 0 ? "<th>" : "<td>") + rows[i][c] + (c === 0 ? "</th>" : "</td>");
      }
      html += "</tr>";
    }
    document.getElementById(id).innerHTML = html;
  }

  function setLanguage(lang) {
    var s = STRINGS[lang];
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (s[key] === undefined) { console.warn("Clé de traduction manquante : " + key + " (" + lang + ")"); return; }
      el.textContent = s[key];
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-html");
      if (s[key] === undefined) { console.warn("Clé de traduction manquante : " + key + " (" + lang + ")"); return; }
      el.innerHTML = s[key];
    });

    /* Le wiki n'a pas de bascule à la volée : ses pages anglaises sont des
       FICHIERS distincts (convention "NomPage-EN"). Les liens sont donc
       réécrits ici, sans quoi le lecteur anglophone atterrirait sur du
       français après avoir choisi l'anglais. */
    document.querySelectorAll("[data-wiki]").forEach(function (el) {
      var page = el.getAttribute("data-wiki");
      el.href = WIKI + page + (lang === "en" ? "-EN" : "");
    });

    for (var id in TABLES) fillTable(id, lang);

    document.getElementById("langToggle").textContent = s.langToggle;
    localStorage.setItem("lang", lang);
  }

  var saved = localStorage.getItem("lang");
  var initial = saved || (navigator.language && navigator.language.toLowerCase().indexOf("fr") === 0 ? "fr" : "en");
  setLanguage(initial);

  document.getElementById("langToggle").addEventListener("click", function () {
    setLanguage(document.documentElement.lang === "fr" ? "en" : "fr");
  });
