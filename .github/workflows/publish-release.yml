name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à republier (ex: v1.14.0)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Déterminer la version
        id: version
        shell: pwsh
        run: |
          $tagName = "${{ inputs.tag || github.ref_name }}"
          $version = $tagName.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tagName" >> $env:GITHUB_OUTPUT

      - name: Build + tests
        run: |
          dotnet build ChaturbateRecorderApp.csproj -c Release
          dotnet test Tests/ChaturbateRecorderApp.Tests.csproj -c Release
          dotnet test SentinelGuard.Tests/SentinelGuard.Tests.csproj -c Release

      # Tools/ (yt-dlp.exe, ffmpeg.exe) est gitignored : absent sur le runner,
      # donc jamais copié dans publish/ (voir Condition="Exists(...)" du .csproj).
      # C'est ce qui garantit que ces binaires ne se retrouvent jamais dans les ZIP.
      - name: Publish - standard (framework-dependent)
        run: dotnet publish ChaturbateRecorderApp.csproj -c Release -r win-x64 --self-contained false -o publish/standard

      - name: Publish - portable (self-contained, single-file)
        run: dotnet publish ChaturbateRecorderApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/portable

      - name: Créer les archives ZIP
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path publish/standard/* -DestinationPath "ChaturbateRecorder-v$v-standard.zip"
          Compress-Archive -Path publish/portable/* -DestinationPath "ChaturbateRecorder-v$v-portable.zip"

      # 86.0 — le SBOM accompagne chaque release : c'est la que la liste des
      # dependances a une valeur verifiable, attachee a un binaire precis.
      - name: Generer le SBOM de la release
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX
          $env:PATH += ";" + (Join-Path $env:USERPROFILE ".dotnet" "tools")
          dotnet CycloneDX ChaturbateRecorderApp.csproj -o . -fn "ChaturbateRecorder-v${{ steps.version.outputs.version }}-sbom.json" -t

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # Convention semver : un tag avec un suffixe (v1.17.1-test) est une
          # pré-version. GitHub l'exclut alors de /releases/latest, donc ni le
          # site ni le vérificateur de mise à jour de l'app ne la voient — c'est
          # ce qui rend la chaîne testable sans toucher à la version publiée.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          # Seul un tag fraîchement poussé devient "latest". Sans ça, l'action
          # met make_latest à true par défaut, donc republier un ancien tag par
          # workflow_dispatch (rattraper les ZIP d'une vieille release, par ex.)
          # désigne cette vieille release comme "latest" — et update-latest-json,
          # qui lit /releases/latest, fait aussitôt régresser le site et le
          # vérificateur de mise à jour de l'app vers cette version. Observé le
          # 2026-08-03 : le site est repassé de 1.17.0 à 1.16.0.
          # Pour qu'une exécution manuelle devienne quand même "latest" :
          # cocher "Set as the latest release" sur la page de la release.
          # La condition sur le suffixe reprend celle de prerelease ci-dessus :
          # l'API refuse qu'une pré-version soit "latest", inutile de le demander.
          make_latest: ${{ github.event_name == 'push' && !contains(steps.version.outputs.tag, '-') }}
          files: |
            ChaturbateRecorder-v${{ steps.version.outputs.version }}-standard.zip
            ChaturbateRecorder-v${{ steps.version.outputs.version }}-portable.zip
            ChaturbateRecorder-v${{ steps.version.outputs.version }}-sbom.json

  # Appel direct plutôt que de compter sur l'évènement "release: published" :
  # une release créée avec le GITHUB_TOKEN par défaut ne déclenche aucun
  # workflow (protection anti-boucle de GitHub), donc docs/latest.json restait
  # sur la version précédente jusqu'au cron quotidien de Update Checker.
  #
  # Les droits Pages/id-token sont accordés ici bien que ce workflow ne déploie
  # rien lui-même : "Update Checker" enchaîne sur "Pages Build" pour publier le
  # docs/latest.json qu'il vient d'écrire, et les permissions d'un appel
  # imbriqué ne peuvent QUE se restreindre le long de la chaîne, jamais
  # s'élargir. Sans ces deux lignes, le déploiement échouerait à la fin d'une
  # release automatisée alors qu'il passerait en exécution manuelle.
  update-latest-json:
    needs: publish
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/update-checker.yml
