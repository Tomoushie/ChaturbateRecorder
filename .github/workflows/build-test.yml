name: Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    # net10.0-windows + WPF (WinForms reste actif, uniquement pour NotifyIcon)
    # : nécessite un runner Windows pour compiler.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build (application principale)
        run: dotnet build ChaturbateRecorderApp.Wpf.csproj -c Release

      - name: Tests (application principale)
        run: dotnet test Tests/ChaturbateRecorderApp.Wpf.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Tests (package SentinelGuard)
        run: dotnet test SentinelGuard.Tests/SentinelGuard.Tests.csproj -c Release --logger "console;verbosity=normal"
