name: Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    # net10.0-windows + WinForms : nécessite un runner Windows pour compiler.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build (application principale)
        run: dotnet build ChaturbateRecorderApp.csproj -c Release

      - name: Tests (application principale)
        run: dotnet test Tests/ChaturbateRecorderApp.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Tests (package ChaturbateRecorder.Security)
        run: dotnet test ChaturbateRecorder.Security.Tests/ChaturbateRecorder.Security.Tests.csproj -c Release --logger "console;verbosity=normal"
