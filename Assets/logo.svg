<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Chaturbate Recorder</title>
  <desc id="desc">Icône de trois flux vidéo convergeant vers un bouton d'enregistrement.</desc>
  <defs>
    <linearGradient id="bg" x1="68" y1="52" x2="446" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18263f"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="stream" x1="119" y1="162" x2="356" y2="363" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55d7ff"/>
      <stop offset="1" stop-color="#3975e8"/>
    </linearGradient>
    <linearGradient id="record" x1="211" y1="190" x2="329" y2="322" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5c69"/>
      <stop offset="1" stop-color="#d71935"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="#6c86ab" stroke-opacity=".32" stroke-width="2"/>

  <!-- Trois sources de live : traits lisibles même à la taille favicon. -->
  <g fill="none" stroke="url(#stream)" stroke-linecap="round" stroke-width="26">
    <path d="M126 155c76 0 81 81 133 81"/>
    <path d="M106 256h153"/>
    <path d="M126 357c76 0 81-81 133-81"/>
  </g>
  <g fill="#88e5ff">
    <circle cx="116" cy="155" r="17"/>
    <circle cx="96" cy="256" r="17"/>
    <circle cx="116" cy="357" r="17"/>
  </g>

  <!-- Bouton REC : point rouge volontairement universel et non affilié. -->
  <g filter="url(#shadow)">
    <circle cx="313" cy="256" r="104" fill="#0c1728" stroke="#5b7194" stroke-width="10"/>
    <circle cx="313" cy="256" r="72" fill="url(#record)"/>
    <circle cx="289" cy="231" r="17" fill="#fff" fill-opacity=".36"/>
  </g>

</svg>
